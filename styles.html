<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gokyo Poster — Style Test</title>
<style>
  :root { --bg: #faf8f4; --card: #fff; --ink: #1c1a17; --muted: #6b6459;
    --accent: #a33b2e; --line: #e5dfd4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, "Segoe UI", sans-serif; padding: 2rem 1rem 5rem; }
  main { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 2.5rem; max-width: 60ch; }
  section { margin: 0 0 3.5rem; }
  h2 { font-size: 1.35rem; margin: 0 0 .1rem; border-bottom: 2px solid var(--accent);
    padding-bottom: .35rem; }
  .blurb { color: var(--muted); margin: .4rem 0 1rem; }
  .model-row { margin-bottom: 1.25rem; }
  .model-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 .4rem; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { font-size: .8rem; color: var(--muted); padding: .5rem .8rem; }
</style>
</head>
<body>
<main>
  <h1>Style Test — Tai Otoshi</h1>
  <p class="sub">One throw, six candidate styles, two image models. Left: the throw. Right: the analogy (roped to an anchor going over the cliff). Pick the style that should carry all 40 pairs.</p>
  <div id="sections"></div>
</main>
<script>
const styles = [
  { id: "sumi-e", name: "Sumi-e ink brush", blurb: "A few confident brushstrokes, vast white paper, one red seal accent. The heritage pick." },
  { id: "patent", name: "Patent diagram", blurb: "Fine engraved linework, hatching, force arrows on aged paper. Mechanics-forward." },
  { id: "pencil", name: "Pencil sketch", blurb: "Loose graphite in a sketchbook, construction lines showing. Warm and human." },
  { id: "geometric", name: "Minimal geometric flat", blurb: "Flat shapes, black + warm red on white, motion arcs. Bauhaus poster spirit." },
  { id: "fineline", name: "Fine-line pen", blurb: "Single-weight thin ink line, sparse red accent. New Yorker spot-illustration energy." },
  { id: "woodblock", name: "Minimal woodblock", blurb: "Flat muted ukiyo-e colors, visible paper grain, cream paper dominant." }
];
const models = [["openai", "OpenAI"], ["google", "Google"]];
document.getElementById("sections").innerHTML = styles.map(s => `
  <section>
    <h2>${s.name}</h2>
    <p class="blurb">${s.blurb}</p>
    ${models.map(([m, label]) => `
      <div class="model-row">
        <p class="model-label">${label}</p>
        <div class="pair">
          <figure><img src="images/style-test/${s.id}-throw-${m}.png" alt="${s.name} — throw (${label})" loading="lazy"><figcaption>Tai Otoshi — the throw</figcaption></figure>
          <figure><img src="images/style-test/${s.id}-analogy-${m}.png" alt="${s.name} — analogy (${label})" loading="lazy"><figcaption>The analogy — anchor off the cliff</figcaption></figure>
        </div>
      </div>`).join("")}
  </section>`).join("");
</script>
</body>
</html>
